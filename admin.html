<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản trị nhà thầu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#18160F;--bg:#F4F2EC;--card:#fff;--muted:#6d6a5c;--line:#E2DDD0;--accent:#B85C2E;--ok:#2E7D32;--danger:#C0392B}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:14px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}
  textarea{resize:vertical;line-height:1.5}
  label{display:block;font-weight:600;font-size:12.5px;margin:0 0 5px;color:#4a4738}
  .hint{font-weight:400;color:var(--muted);font-size:11.5px}
  .btn{border:0;border-radius:9px;padding:11px 18px;font-weight:700;font-size:13.5px}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn-danger{background:#fff;border:1px solid #e6c3bd;color:var(--danger)}

  /* Login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px;width:100%;max-width:380px;box-shadow:0 20px 50px -30px rgba(0,0,0,.3)}
  .login-card h1{font-size:22px;margin:0 0 6px}
  .login-card p{color:var(--muted);font-size:13px;margin:0 0 22px}
  .login-card .field{margin-bottom:14px}
  .login-err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px}
  .mode-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;margin-bottom:16px}
  .mode-demo{background:#FFF3E6;color:#8a5a1a}.mode-fb{background:#E7F4EA;color:#1e7d3a}

  /* App */
  #app{display:none;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px clamp(16px,3vw,28px)}
  .topbar .l{display:flex;align-items:center;gap:12px;font-weight:800}
  .topbar .mk{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
  .topbar .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .layout{display:grid;grid-template-columns:290px 1fr;gap:0;align-items:start}
  .sidebar{border-right:1px solid var(--line);min-height:calc(100vh - 53px);padding:16px;position:sticky;top:53px;max-height:calc(100vh - 53px);overflow:auto}
  .sidebar h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 4px 12px}
  .clist{display:flex;flex-direction:column;gap:6px}
  .citem{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid transparent;cursor:pointer}
  .citem:hover{background:#fff}
  .citem.active{background:#fff;border-color:var(--line)}
  .citem .av{width:34px;height:34px;border-radius:8px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;overflow:hidden;flex-shrink:0}
  .citem .av img{width:100%;height:100%;object-fit:contain;background:#fff}
  .citem .nm{font-weight:700;font-size:13.5px}
  .citem .tg{font-size:11.5px;color:var(--muted)}
  .citem .unpub{margin-left:auto;font-size:10px;color:#b0764a;background:#fbeede;padding:2px 7px;border-radius:100px}
  .main{padding:clamp(16px,3vw,28px)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
  .panel h3{margin:0 0 4px;font-size:16px}
  .panel .sh{color:var(--muted);font-size:12.5px;margin:0 0 18px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{margin-bottom:14px}
  .chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
  .chk input{width:auto}
  .tpl-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .tpl-opt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff}
  .tpl-opt.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(184,92,46,.15)}
  .tpl-opt .tn{font-weight:700;font-size:13px}
  .tpl-opt .td{font-size:11px;color:var(--muted)}
  .preview-wrap{position:sticky;top:69px}
  .preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .preview-frame{width:100%;height:calc(100vh - 130px);border:1px solid var(--line);border-radius:14px;background:#fff}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .save-msg{font-size:12.5px;font-weight:600;color:var(--ok);align-self:center}
  .save-msg.err{color:var(--danger)}
  hr{border:0;border-top:1px solid var(--line);margin:18px 0}
  @media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none;min-height:0;border-right:0;border-bottom:1px solid var(--line)}.split{grid-template-columns:1fr}.preview-wrap{position:static}.preview-frame{height:70vh}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <form class="login-card" id="loginForm">
    <span class="mode-badge" id="modeBadge"></span>
    <h1>Quản trị nhà thầu</h1>
    <p id="loginHint">Đăng nhập để quản lý hồ sơ nhà thầu.</p>
    <div class="field"><label>Email</label><input type="email" id="email" placeholder="admin@dezon.vn" required></div>
    <div class="field"><label>Mật khẩu</label><input type="password" id="password" placeholder="••••••••" required></div>
    <button class="btn btn-primary" style="width:100%" type="submit">Đăng nhập</button>
    <div class="login-err" id="loginErr"></div>
  </form>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="l"><span class="mk">N</span> Quản trị nhà thầu <span class="mode-badge" id="modeBadge2"></span></div>
    <div class="r">
      <a class="btn btn-ghost" href="index.html" target="_blank">Xem trang danh bạ ↗</a>
      <button class="btn btn-ghost" id="importBtn">Nhập JSON</button>
      <button class="btn btn-ghost" id="exportBtn">Xuất JSON</button>
      <button class="btn btn-ghost" id="logoutBtn">Đăng xuất</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <h2>Nhà thầu</h2>
      <button class="btn btn-accent" style="width:100%;margin-bottom:14px" id="newBtn">+ Thêm nhà thầu</button>
      <div class="clist" id="clist"></div>
    </aside>

    <main class="main">
      <div class="split">
        <!-- FORM -->
        <div class="panel">
          <h3 id="formTitle">Thông tin nhà thầu</h3>
          <p class="sh">Điền thông tin, xem trước bên phải, rồi bấm Lưu.</p>
          <form id="form">
            <div class="row2">
              <div class="field"><label>Mã (slug) <span class="hint">— không dấu, không cách</span></label><input id="f_id" placeholder="vd: kien-phong" required></div>
              <div class="field"><label>Tên nhà thầu</label><input id="f_name" placeholder="Kiến Phong" required></div>
            </div>
            <div class="field"><label>Slogan / mô tả ngắn</label><input id="f_tagline" placeholder="Kiến trúc & nội thất Design & Build"></div>
            <div class="row2">
              <div class="field"><label>Nhãn ảnh bìa (badge)</label><input id="f_badge" placeholder="Thiết kế & thi công nội thất"></div>
              <div class="field"><label>Nhóm / danh mục <span class="hint">— để lọc</span></label><input id="f_category" placeholder="Nội thất Biệt thự"></div>
            </div>
            <div class="field"><label>Thẻ tag <span class="hint">— cách nhau bởi dấu phẩy</span></label><input id="f_tags" placeholder="Nội thất, Indochine, Hiện đại"></div>

            <hr>
            <label>Chọn template (10 mẫu)</label>
            <div class="tpl-picker" id="tplPicker"></div>

            <hr>
            <div class="row2">
              <div class="field"><label>Ảnh bìa (cover) URL</label><input id="f_cover" placeholder="https://... hoặc đường dẫn ảnh"></div>
              <div class="field"><label>Ảnh hero URL</label><input id="f_hero" placeholder="https://..."></div>
            </div>
            <div class="row2">
              <div class="field"><label>Logo URL <span class="hint">— có thể để trống</span></label><input id="f_logo" placeholder="https://..."></div>
              <div class="field" style="display:flex;align-items:flex-end;gap:14px">
                <label class="chk"><input type="checkbox" id="f_loginv"> Logo trắng (đảo màu trên nền sáng)</label>
              </div>
            </div>
            <div style="display:flex;gap:20px;margin-bottom:14px">
              <label class="chk"><input type="checkbox" id="f_verified" checked> Đã xác minh</label>
              <label class="chk"><input type="checkbox" id="f_published" checked> Xuất bản (hiện cho user)</label>
            </div>

            <hr>
            <div class="field"><label>Giới thiệu <span class="hint">— mỗi đoạn một dòng</span></label><textarea id="f_about" rows="4" placeholder="Đoạn 1...&#10;Đoạn 2..."></textarea></div>
            <div class="field"><label>Số liệu nổi bật <span class="hint">— mỗi dòng: giá trị | nhãn</span></label><textarea id="f_stats" rows="4" placeholder="15+ | Năm kinh nghiệm&#10;1000+ | Công trình"></textarea></div>
            <div class="field"><label>Dịch vụ <span class="hint">— mỗi dòng: tên | mô tả</span></label><textarea id="f_services" rows="5" placeholder="Thi công nội thất | Hoàn thiện nội thất cao cấp..."></textarea></div>
            <div class="field"><label>Lý do chọn / cam kết <span class="hint">— mỗi dòng: tiêu đề | mô tả</span></label><textarea id="f_why" rows="4" placeholder="Tiết kiệm thời gian | Quy trình khép kín..."></textarea></div>
            <div class="field"><label>Quy trình <span class="hint">— mỗi dòng: bước | mô tả</span></label><textarea id="f_process" rows="4" placeholder="Khảo sát & tư vấn | Tiếp nhận nhu cầu..."></textarea></div>
            <div class="field"><label>Dự án <span class="hint">— mỗi dòng: tên | thông tin | nhãn | URL ảnh</span></label><textarea id="f_projects" rows="5" placeholder="Solar Villa | Hà Nội · 390m² | Indochine | https://.../anh.jpg"></textarea></div>
            <div class="field"><label>Phong cách <span class="hint">— mỗi dòng: tên | mô tả (tùy chọn)</span></label><textarea id="f_styles" rows="3" placeholder="Đông Dương | Giao thoa Pháp - Á Đông..."></textarea></div>

            <hr>
            <div class="row2">
              <div class="field"><label>Hotline</label><input id="f_phone" placeholder="0972.868.627"></div>
              <div class="field"><label>Hotline 2</label><input id="f_phone2" placeholder="0974.410.244"></div>
            </div>
            <div class="row2">
              <div class="field"><label>Email</label><input id="f_email" placeholder="email@congty.vn"></div>
              <div class="field"><label>Facebook URL</label><input id="f_facebook" placeholder="https://facebook.com/..."></div>
            </div>
            <div class="field"><label>Website URL</label><input id="f_website" placeholder="https://..."></div>
            <div class="field"><label>Văn phòng <span class="hint">— mỗi dòng: tên | địa chỉ</span></label><textarea id="f_offices" rows="3" placeholder="Văn phòng TP.HCM | 30-32 Đinh Thị Thi, Vạn Phúc..."></textarea></div>

            <div class="actions">
              <button type="submit" class="btn btn-primary">Lưu nhà thầu</button>
              <button type="button" class="btn btn-danger" id="deleteBtn">Xóa</button>
              <span class="save-msg" id="saveMsg"></span>
            </div>
          </form>
        </div>

        <!-- PREVIEW -->
        <div class="preview-wrap">
          <div class="preview-head">
            <strong>Xem trước</strong>
            <span class="hint" id="previewTpl"></span>
          </div>
          <iframe class="preview-frame" id="preview"></iframe>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/templates.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var current = null; // đang chỉnh sửa
  var list = [];

  /* ---------- helpers parse/serialize ---------- */
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];}); }
  function lines(t){ return (t||"").split("\n").map(function(s){return s.trim();}).filter(Boolean); }
  function parseRows(t, keys){ return lines(t).map(function(ln){ var p=ln.split("|").map(function(s){return s.trim();}); var o={}; keys.forEach(function(k,i){ o[k]=p[i]||""; }); return o; }); }
  function rowsToText(arr, keys){ return (arr||[]).map(function(o){ return keys.map(function(k){return o[k]||"";}).join(" | "); }).join("\n"); }
  function csv(t){ return (t||"").split(",").map(function(s){return s.trim();}).filter(Boolean); }
  function initials(n){ return (n||"?").trim().split(/\s+/).slice(0,2).map(function(w){return w[0];}).join("").toUpperCase(); }

  /* ---------- form <-> object ---------- */
  function blank(){ return { id:"", name:"", tagline:"", badge:"", category:"", tags:[], template:"t1", cover:"", hero:"", logo:"", logoInvertOnLight:false, verified:true, published:true, about:[], stats:[], services:[], why:[], process:[], projects:[], styles:[], contact:{} }; }

  function fillForm(c){
    current = c;
    $("f_id").value=c.id||""; $("f_name").value=c.name||""; $("f_tagline").value=c.tagline||"";
    $("f_badge").value=c.badge||""; $("f_category").value=c.category||""; $("f_tags").value=(c.tags||[]).join(", ");
    $("f_cover").value=c.cover||""; $("f_hero").value=c.hero||""; $("f_logo").value=c.logo||"";
    $("f_loginv").checked=!!c.logoInvertOnLight; $("f_verified").checked=c.verified!==false; $("f_published").checked=c.published!==false;
    $("f_about").value=(c.about||[]).join("\n");
    $("f_stats").value=rowsToText(c.stats,["value","label"]);
    $("f_services").value=rowsToText(c.services,["title","desc"]);
    $("f_why").value=rowsToText(c.why,["title","desc"]);
    $("f_process").value=rowsToText(c.process,["title","desc"]);
    $("f_projects").value=rowsToText(c.projects,["title","meta","badge","image"]);
    $("f_styles").value=rowsToText(c.styles,["name","desc"]);
    var k=c.contact||{};
    $("f_phone").value=k.phone||""; $("f_phone2").value=k.phone2||""; $("f_email").value=k.email||"";
    $("f_facebook").value=k.facebook||""; $("f_website").value=k.website||"";
    $("f_offices").value=rowsToText(k.offices,["label","address"]);
    setTemplate(c.template||"t1");
    $("formTitle").textContent = c.id ? ("Sửa: "+c.name) : "Thêm nhà thầu mới";
    renderPreview();
  }

  function readForm(){
    return {
      id: $("f_id").value.trim(),
      name: $("f_name").value.trim(),
      tagline: $("f_tagline").value.trim(),
      badge: $("f_badge").value.trim(),
      category: $("f_category").value.trim(),
      tags: csv($("f_tags").value),
      template: selectedTpl,
      cover: $("f_cover").value.trim(),
      hero: $("f_hero").value.trim(),
      logo: $("f_logo").value.trim(),
      logoInvertOnLight: $("f_loginv").checked,
      verified: $("f_verified").checked,
      published: $("f_published").checked,
      about: lines($("f_about").value),
      stats: parseRows($("f_stats").value,["value","label"]),
      services: parseRows($("f_services").value,["title","desc"]),
      why: parseRows($("f_why").value,["title","desc"]),
      process: parseRows($("f_process").value,["title","desc"]),
      projects: parseRows($("f_projects").value,["title","meta","badge","image"]),
      styles: parseRows($("f_styles").value,["name","desc"]),
      contact: {
        phone: $("f_phone").value.trim(), phone2: $("f_phone2").value.trim(), email: $("f_email").value.trim(),
        facebook: $("f_facebook").value.trim(), website: $("f_website").value.trim(),
        offices: parseRows($("f_offices").value,["label","address"])
      }
    };
  }

  /* ---------- template picker ---------- */
  var selectedTpl = "t1";
  function buildPicker(){
    $("tplPicker").innerHTML = window.TEMPLATE_LIST.map(function(t){
      return '<div class="tpl-opt" data-id="'+t.id+'"><div class="tn">'+esc(t.name)+'</div><div class="td">'+esc(t.desc)+'</div></div>';
    }).join("");
    Array.prototype.forEach.call($("tplPicker").children, function(el){
      el.addEventListener("click", function(){ setTemplate(el.getAttribute("data-id")); renderPreview(); });
    });
  }
  function setTemplate(id){
    selectedTpl = id;
    Array.prototype.forEach.call($("tplPicker").children, function(el){ el.classList.toggle("active", el.getAttribute("data-id")===id); });
    var t=(window.TEMPLATE_LIST.filter(function(x){return x.id===id;})[0])||{};
    $("previewTpl").textContent = t.name||id;
  }

  /* ---------- preview ---------- */
  function buildDoc(c){
    var out = window.renderTemplate(c.template||selectedTpl, c);
    var fontUrl = (out.fonts&&out.fonts.length) ? "https://fonts.googleapis.com/css2?"+out.fonts.map(function(f){return "family="+f;}).join("&")+"&display=swap" : "";
    return "<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>"+
      (fontUrl?"<link rel='stylesheet' href='"+fontUrl+"'>":"")+
      "<style>html,body{margin:0}</style><style>"+out.css+"</style></head><body>"+
      "<div class='tpl "+out.root+"' data-loginv='"+(c.logoInvertOnLight?"1":"0")+"'>"+out.html+"</div></body></html>";
  }
  var pvTimer=null;
  function renderPreview(){
    clearTimeout(pvTimer);
    pvTimer=setTimeout(function(){
      var c=readForm(); if(!c.name) c.name="(Chưa có tên)";
      $("preview").srcdoc = buildDoc(c);
    },250);
  }

  /* ---------- sidebar list ---------- */
  function renderList(){
    $("clist").innerHTML = list.map(function(c){
      var av = c.logo ? '<img src="'+esc(c.logo)+'" alt="">' : esc(initials(c.name));
      return '<div class="citem'+(current&&current.id===c.id?" active":"")+'" data-id="'+esc(c.id)+'">'+
        '<div class="av">'+av+'</div><div><div class="nm">'+esc(c.name)+'</div><div class="tg">'+esc(c.tagline||"")+'</div></div>'+
        (c.published===false?'<span class="unpub">ẩn</span>':"")+'</div>';
    }).join("") || '<div style="color:var(--muted);font-size:13px;padding:8px">Chưa có nhà thầu nào.</div>';
    Array.prototype.forEach.call($("clist").children, function(el){
      if(!el.getAttribute) return;
      var id=el.getAttribute("data-id"); if(!id) return;
      el.addEventListener("click", function(){ var c=list.filter(function(x){return x.id===id;})[0]; if(c) fillForm(JSON.parse(JSON.stringify(c))); renderList(); });
    });
  }

  async function refresh(){ list = await DB.list(); renderList(); }

  /* ---------- actions ---------- */
  function msg(t, err){ var m=$("saveMsg"); m.textContent=t; m.className="save-msg"+(err?" err":""); if(t) setTimeout(function(){ if(m.textContent===t) m.textContent=""; }, 4000); }

  $("form").addEventListener("submit", async function(e){
    e.preventDefault();
    var c=readForm();
    if(!c.id){ msg("Cần nhập Mã (slug)", true); return; }
    if(!/^[a-z0-9-]+$/.test(c.id)){ msg("Slug chỉ gồm chữ thường, số và dấu -", true); return; }
    try{ await DB.save(c); await refresh(); msg("Đã lưu ✓"); }
    catch(err){ msg("Lỗi: "+(err.message||err), true); }
  });
  $("form").addEventListener("input", renderPreview);

  $("newBtn").addEventListener("click", function(){ fillForm(blank()); renderList(); });

  $("deleteBtn").addEventListener("click", async function(){
    var id=$("f_id").value.trim(); if(!id){ fillForm(blank()); return; }
    if(!confirm("Xóa nhà thầu '"+id+"'? Không thể hoàn tác.")) return;
    try{ await DB.remove(id); await refresh(); fillForm(blank()); msg("Đã xóa"); }
    catch(err){ msg("Lỗi: "+(err.message||err), true); }
  });

  $("exportBtn").addEventListener("click", async function(){
    var all = await DB.list();
    var blob = new Blob([JSON.stringify({contractors:all}, null, 2)], {type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="contractors.json"; a.click();
  });
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
  $("importFile").addEventListener("change", function(e){
    var f=e.target.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=async function(){
      try{
        var j=JSON.parse(rd.result); var arr=Array.isArray(j)?j:(j.contractors||[]);
        if(!confirm("Nhập "+arr.length+" nhà thầu? (ghi đè trùng mã)")) return;
        await DB.replaceAll(arr); await refresh(); msg("Đã nhập "+arr.length+" nhà thầu");
      }catch(err){ msg("File JSON không hợp lệ", true); }
    };
    rd.readAsText(f); e.target.value="";
  });

  $("logoutBtn").addEventListener("click", function(){ DB.logout(); });

  /* ---------- auth ---------- */
  function badges(){
    var b = DB.mode==="firebase" ? {t:"Firebase",c:"mode-fb"} : {t:"Chế độ DEMO",c:"mode-demo"};
    ["modeBadge","modeBadge2"].forEach(function(id){ var e=$(id); if(e){ e.textContent=b.t; e.className="mode-badge "+b.c; } });
    if(DB.mode!=="firebase"){ $("loginHint").innerHTML='Chưa cấu hình Firebase — đang ở <b>chế độ demo</b>. Đăng nhập bằng mật khẩu: <b>demo</b>'; }
  }
  badges();
  buildPicker();

  $("loginForm").addEventListener("submit", async function(e){
    e.preventDefault(); $("loginErr").textContent="";
    try{ await DB.login($("email").value.trim(), $("password").value); }
    catch(err){ $("loginErr").textContent = err.code==="demo/wrong" ? err.message : "Đăng nhập thất bại: "+(err.message||err); }
  });

  DB.onAuth(function(user){
    if(user){
      $("login").style.display="none"; $("app").style.display="block";
      refresh().then(function(){ if(list[0]) fillForm(JSON.parse(JSON.stringify(list[0]))); else fillForm(blank()); });
    } else {
      $("app").style.display="none"; $("login").style.display="flex";
    }
  });
})();
</script>
</body>
</html>
